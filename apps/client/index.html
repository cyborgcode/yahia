<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#150f1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>YAHIA</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2e3c4;
        --dim: #8a7c93;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0a070e;
        color: var(--ink);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Keep the canvas clear of notches and the home indicator. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        /* Stops the browser stealing drags for scroll/zoom — vital on phones. */
        touch-action: none;
      }
      canvas {
        display: block;
        /* Largest box that FITS. width/height:100% + object-fit sized the
           element from its intrinsic aspect ratio instead of the viewport, so
           on a phone the canvas overflowed vertically and silently clipped the
           top and bottom of the game — HUD included. max-* + auto cannot. */
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* The thumb pad.
         The viewport is ~1.19:1, so held upright it fills the width and leaves
         most of the screen below it empty. That space is not waste — it is where
         thumbs already were, so it becomes the controller and the game stops
         being played through its own picture. Landscape has no room below the
         canvas and doesn't need any: it hides. */
      #pad {
        display: none;
      }
      @media (orientation: portrait) {
        #stage {
          justify-content: flex-start;
        }
        #pad {
          display: flex;
          flex: 1 1 auto;
          width: 100%;
          min-height: 0;
        }
      }
      .pad-half {
        flex: 1;
        display: grid;
        place-items: center;
        font-size: 11px;
        letter-spacing: 0.34em;
        color: var(--dim);
        border-top: 1px solid #1c1526;
        transition: background-color 60ms linear;
      }
      #pad-slide {
        border-right: 1px solid #1c1526;
      }
      /* Pressed state is set from the input layer, not :active — a pointer that
         went down on the canvas and slid onto the pad is still a held button. */
      #pad-slide.on {
        background: rgba(61, 154, 212, 0.22);
        color: var(--ink);
      }
      #pad-jump.on {
        background: rgba(255, 215, 94, 0.22);
        color: var(--ink);
      }

      /* Loading and title. Same layout both times: the hero in the middle, the
         one thing you tap at the bottom where a thumb already is. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: #0a070e;
        padding: calc(20px + env(safe-area-inset-top)) 20px
          calc(20px + env(safe-area-inset-bottom));
        transition: opacity 220ms linear;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.42em;
        /* Tracking pads the right side only; indent puts the block back centre. */
        text-indent: 0.42em;
        text-align: center;
      }
      #boot h1 small {
        display: block;
        margin-top: 8px;
        font-size: 17px;
        letter-spacing: 0;
        text-indent: 0;
        color: var(--dim);
      }
      #hero {
        height: min(44vh, 360px);
        width: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #kits {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 300px;
      }
      .kit {
        aspect-ratio: 1;
        border: 0;
        border-radius: 50%;
        box-shadow: inset 0 0 0 2px rgba(10, 7, 14, 0.55);
        transition: transform 120ms ease, box-shadow 120ms ease;
      }
      .kit.on {
        transform: scale(1.18);
        box-shadow: 0 0 0 2px var(--ink);
      }
      #boot-foot {
        width: 100%;
        max-width: 300px;
        min-height: 56px;
        display: grid;
        place-items: center;
      }
      #boot-status {
        color: var(--dim);
        letter-spacing: 0.34em;
        text-indent: 0.34em;
      }
      #play {
        width: 100%;
        padding: 18px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #0a070e;
        background: #ffd75e;
        border: 0;
        border-radius: 3px;
      }
      #play:active {
        background: #e8c24f;
      }

      #tuner {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
        max-height: 100dvh;
        overflow-y: auto;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(10, 7, 14, 0.94);
        border-right: 1px solid #2e2334;
        width: min(300px, 82vw);
      }
      #tuner h2 {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--dim);
        margin-bottom: 8px;
      }
      #tuner label {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        margin-bottom: 6px;
        font-size: 10px;
        color: var(--dim);
      }
      #tuner label b {
        color: var(--ink);
        font-weight: 600;
      }
      #tuner input[type='range'] {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: #ffd75e;
      }
      #tuner button {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        font: inherit;
        letter-spacing: 0.2em;
        color: #0a070e;
        background: #ffd75e;
        border: 0;
        border-radius: 2px;
      }
      /* Top-right, NOT bottom-right: in landscape both bottom corners are under
         a thumb for the whole round, and a button there eats jump taps. */
      #tuner-toggle {
        position: fixed;
        z-index: 21;
        right: calc(6px + env(safe-area-inset-right));
        top: calc(6px + env(safe-area-inset-top));
        width: 44px;
        height: 44px;
        opacity: 0.5;
        font-size: 18px;
        color: var(--ink);
        background: rgba(10, 7, 14, 0.75);
        border: 1px solid #2e2334;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="pad">
        <div class="pad-half" id="pad-slide">SLIDE</div>
        <div class="pad-half" id="pad-jump">JUMP</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
