# Matches the repository name, because Workers Builds derives the Worker name
# from the repo and overrides this file when they disagree — then opens a pull
# request offering to change it for you.
name = "yahia"
main = "worker.mjs"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RaceRoom"

# Durable Objects with a JS class need a migration tag the first time they ship.
#
# SQLite-backed rather than the older key-value backing, because that is the
# only kind the Workers Free plan will deploy — and a room that needs a paid
# account to exist is a room nobody will stand up. The object stores nothing but
# an alarm, so the backing choice costs us nothing either way.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]
